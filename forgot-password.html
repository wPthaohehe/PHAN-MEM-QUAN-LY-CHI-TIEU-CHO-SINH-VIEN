<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poketto - Quên mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <div class="watermark-bg"></div>

    <div class="site-header">
        <img src="poketto-logo.png" alt="Poketto" class="header-logo-full">
    </div>

    <div class="forgot-box">
        <div class="brand">
            <img src="cat-savings.png" alt="Poketto" class="logo-placeholder">
            <p class="brand-tagline">Đừng lo, để Poketto giúp bạn nhé<span class="excl">!</span></p>
        </div>

        <h2>Quên mật khẩu?</h2>
        <p class="forgot-desc">Nhập email đã đăng ký, Poketto sẽ gửi cho bạn mã OTP để đặt lại mật khẩu.</p>

        <form id="forgotForm">
            <label>Email</label>
            <input type="email" id="forgotEmail" placeholder="Nhập email đã đăng ký" required>

            <button type="submit">Gửi mã OTP</button>
        </form>

        <div id="successMessage" class="success-message">
            <div class="success-icon">✅</div>
            <p class="success-title">Kiểm tra hòm thư của bạn</p>
            <p class="success-desc">Poketto đã gửi mã OTP đến email bạn vừa nhập. Vui lòng kiểm tra hộp thư đến (hoặc mục Spam) để tiếp tục.</p>
        </div>

        <p class="login-link">Đã nhớ ra mật khẩu? <a href="login.html">Quay lại đăng nhập</a></p>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const successMessage = document.getElementById('successMessage');

        forgotForm.addEventListener('submit', function (e) {
            e.preventDefault();
            // Đây là bản demo giao diện, chưa gửi email thật.
            // Khi có backend, thay đoạn này bằng việc gọi API gửi OTP thật.
            forgotForm.style.display = 'none';
            successMessage.style.display = 'block';
        });
    </script>
</body>
</html>
