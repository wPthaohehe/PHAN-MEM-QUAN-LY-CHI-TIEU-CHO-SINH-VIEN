<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poketto - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="watermark-bg"></div>

    <div class="site-header">
        <img src="poketto-logo.png" alt="Poketto" class="header-logo-full">
    </div>

    <div class="login-box">
        <div class="brand">
            <img src="cat-savings.png" alt="Poketto" class="logo-placeholder">
            <p class="brand-tagline">Chủ nhân<span class="excl">!</span> Tới giờ tiết kiệm rồi ạ<span class="excl">!</span><span class="excl">!</span><span class="excl">!</span></p>
        </div>

        <h2>Đăng nhập</h2>
        <form>
            <label>Email/Tên đăng nhập</label>
            <input type="text" placeholder="Nhập email hoặc tên đăng nhập">

            <label>Mật khẩu</label>
            <input type="password" placeholder="Nhập mật khẩu">

            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <button type="submit">Đăng nhập</button>
        </form>

        <p class="register-link">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </div>
</body>
</html>
