<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poketto - Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="watermark-bg"></div>

    <div class="site-header">
        <img src="poketto-logo.png" alt="Poketto" class="header-logo-full">
    </div>

    <div class="register-box">
        <div class="brand">
            <img src="cat-savings.png" alt="Poketto" class="logo-placeholder">
            <p class="brand-tagline">Chủ nhân<span class="excl">!</span> Tới giờ tiết kiệm rồi ạ<span class="excl">!</span><span class="excl">!</span><span class="excl">!</span></p>
        </div>

        <h2>Đăng ký</h2>
        <form>
            <label>Họ và tên</label>
            <input type="text" placeholder="Nhập họ và tên">

            <label>Email</label>
            <input type="email" placeholder="Nhập email">

            <label>Số điện thoại</label>
            <input type="tel" placeholder="Nhập số điện thoại">

            <label>Mật khẩu</label>
            <input type="password" placeholder="Nhập mật khẩu">

            <label>Xác nhận mật khẩu</label>
            <input type="password" placeholder="Nhập lại mật khẩu">

            <label class="checkbox-label terms-label">
                <input type="checkbox" name="terms">
                <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> của Poketto</span>
            </label>

            <button type="submit">Đăng ký</button>
        </form>

        <p class="login-link">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </div>
</body>
</html>
