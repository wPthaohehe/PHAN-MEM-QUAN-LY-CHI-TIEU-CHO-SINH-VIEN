<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poketto - Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="watermark-bg"></div>

    <div class="site-header">
        <img src="../assets/poketto-logo.png" alt="Poketto" class="header-logo-full">
    </div>

    <div class="register-box">
        <div class="brand">
            <img src="../assets/cat-savings.png" alt="Poketto" class="logo-placeholder">
            <p class="brand-tagline">Chủ nhân<span class="excl">!</span> Tới giờ tiết kiệm rồi ạ<span class="excl">!</span><span class="excl">!</span><span class="excl">!</span></p>
        </div>

        <h2>Đăng ký</h2>
        <form id="registerForm" novalidate>
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" placeholder="Nhập họ và tên">
            <span id="fullNameError" class="field-error"></span>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email">
            <span id="emailError" class="field-error"></span>

            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" placeholder="Nhập số điện thoại">
            <span id="phoneError" class="field-error"></span>

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu">
            <span id="passwordError" class="field-error"></span>

            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
            <span id="confirmPasswordError" class="field-error"></span>

            <label class="checkbox-label terms-label">
                <input type="checkbox" id="terms" name="terms">
                <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> của Poketto</span>
            </label>
            <span id="termsError" class="field-error"></span>

            <span id="formError" class="field-error form-error"></span>

            <button type="submit">Đăng ký</button>
        </form>

        <p class="login-link">Đã có tài khoản? <a href="../login/login.html">Đăng nhập</a></p>
    </div>

    <script src="register.js"></script>
</body>
</html>
